<!doctype html>
<html lang="en">
<head>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plannos</title>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/split.js/1.6.5/split.min.js"></script>

  <style>
    :root {
      --bg: #F8FAFC;         
      --panel: #FFFFFF;      
      --text: #0F172A;      
      --muted: #64748B;      
      --border: #E2E8F0;     
      
      --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.06), 0 2px 4px -1px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 20px 25px -5px rgba(15, 23, 42, 0.05), 0 8px 10px -6px rgba(15, 23, 42, 0.01);
      
      --accent: #0F172A;    
      --accent-hover: #334155; 
      --accent-light: #F1F5F9; 
     
      --radius-lg: 12px;
      --radius-xl: 16px;
      
      --sans: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* =========================================
       ✨ 全局美化滚动条
       ========================================= */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background-color: #CBD5E1; border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background-color: #94A3B8; }
    
    * { box-sizing: border-box; }
    
    body { 
      margin: 0; 
      font-family: var(--sans); 
      background: var(--bg); 
      color: var(--text); 
      min-height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      padding: 24px; 
    }

    /* 修改 .shell 布局为三列仪表盘 */
    /* 修改 .shell 布局，强制三列并排 */
    /* 修改 .shell 为 Flex 布局，适应 Split.js 拖拽 */
    .shell { 
      width: 100%; 
      max-width: 100%; 
      display: flex; /* 改为 flex */
      flex-direction: row;
      gap: 0; /* 取消原本的 gap，由拖拽条代替 */
      height: 95vh; 
    }

    @media (max-width: 900px){ 
      .shell { flex-direction: column; height: auto; } 
    }

    /* =========================================
       📏 拖拽分割线 (Gutter) 样式
       ========================================= */
    /* 去掉原本写死的 gap 和 flex 比例，交给 Split.js 动态计算 */
    .right-panel { display: flex; flex-direction: column; height: 100%; min-width: 0; }
    .map-block { background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-md); overflow: hidden; position: relative; }
    .er-block { display: flex; flex-direction: column; background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-md); overflow: hidden; }

    /* =========================================
       📏 拖拽分割线 (Gutter) 样式
       ========================================= */
    .gutter {
      background-color: transparent;
      background-repeat: no-repeat;
      background-position: 50%;
      border-radius: 4px;
      transition: background-color 0.2s ease;
    }

    /* 水平拖拽条 (左右分栏) */
    .gutter.gutter-horizontal {
      cursor: col-resize;
      margin: 0 8px; /* 左右留白 */
    }
    .gutter.gutter-horizontal:hover, .gutter.gutter-horizontal.gutter-dragging {
      background-color: #CBD5E1;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="4" height="20" viewBox="0 0 4 20"><circle cx="2" cy="2" r="2" fill="%239CA3AF"/><circle cx="2" cy="10" r="2" fill="%239CA3AF"/><circle cx="2" cy="18" r="2" fill="%239CA3AF"/></svg>');
    }

    /* ✅ 新增：垂直拖拽条 (上下分栏) */
    .gutter.gutter-vertical {
      cursor: row-resize;
      margin: 8px 0; /* 上下留白 */
    }
    .gutter.gutter-vertical:hover, .gutter.gutter-vertical.gutter-dragging {
      background-color: #CBD5E1;
      /* 横向的三个小圆点 */
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="4" viewBox="0 0 20 4"><circle cx="2" cy="2" r="2" fill="%239CA3AF"/><circle cx="10" cy="2" r="2" fill="%239CA3AF"/><circle cx="18" cy="2" r="2" fill="%239CA3AF"/></svg>');
    }

    .sidebar { display: flex; flex-direction: column; gap: 16px; max-height: 85vh; overflow-y: auto; padding-right: 4px; }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb { background-color: var(--border); border-radius: 4px; }

    .card { background: var(--panel); border: 1px solid rgba(226, 232, 240, 0.8); border-radius: var(--radius-lg); box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05); overflow: hidden; flex-shrink: 0; transition: box-shadow 0.3s ease, transform 0.3s ease; }
    .card:hover { box-shadow: 0 8px 24px -4px rgba(15, 23, 42, 0.08); }

    .brand { display: flex; align-items: center; gap: 14px; padding: 20px 24px; border-bottom: 1px solid var(--border); background: #ffffff; }
    .logo { width: 40px; height: 40px; object-fit: contain; border-radius: 10px; background: var(--accent-light); padding: 8px; }
    .brand h1 { font-size: 18px; font-weight: 700; margin: 0; color: #111827; letter-spacing: -0.02em; }
    .brand p { margin: 4px 0 0 0; font-size: 13px; color: var(--muted); }

    .info-section { padding: 20px 24px; }
    .info-section h3 { margin: 0 0 16px 0; font-size: 13px; font-weight: 700; color: #111827; text-transform: uppercase; letter-spacing: 0.05em; }
    
    .filter-group { margin-bottom: 16px; }
    .filter-group:last-child { margin-bottom: 0; }
    .filter-group label.group-title { font-size: 12px; font-weight: 600; color: #4B5563; margin-bottom: 8px; display: block; }
    
    .filter-group select, .filter-group input[type="text"], .filter-group input[type="date"] { 
      width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); 
      font-family: var(--sans); font-size: 13.5px; color: #111827; background: #F8FAFC; outline: none; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
    }
    .filter-group select:focus, .filter-group input[type="text"]:focus, .filter-group input[type="date"]:focus { 
      border-color: #94A3B8; background: #ffffff; box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.05); 
    }
    .filter-group input::placeholder { color: #9CA3AF; }

    .sidebar-mode-selector { display: flex; flex-direction: column; gap: 8px; }
    .sidebar-mode-selector label { cursor: pointer; }
    .sidebar-mode-selector input[type="radio"] { display: none; }
    .sidebar-mode-selector span { display: block; padding: 10px 14px; font-size: 13px; font-weight: 500; color: var(--muted); background: var(--bg); border-radius: 8px; border: 1px solid var(--border); transition: all 0.2s ease; }
    .sidebar-mode-selector input[type="radio"]:checked + span { background: #111827; color: #ffffff; border-color: #111827; font-weight: 600; box-shadow: var(--shadow-sm); }

    .date-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px;}
    .date-row span { font-size: 12px; color: var(--muted); width: 36px; font-weight: 500;}

    .slider-row { display: flex; align-items: center; gap: 12px; }
    .slider-row input[type="range"] { flex: 1; accent-color: #111827; cursor: pointer; }
    .slider-row .val-display { font-weight: 700; color: #111827; font-size: 14px; min-width: 20px; text-align: right;}

    .main { display: flex; flex-direction: column; height: 85vh; min-height: 600px; box-shadow: var(--shadow-lg); }

    .toolbar { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; border-bottom: 1px solid var(--border); background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); z-index: 10; }
    
    .actions button { appearance: none; border: 1px solid var(--border); background: #ffffff; color: #374151; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s ease; box-shadow: var(--shadow-sm); }
    .actions button:hover { background: #F9FAFB; border-color: #D1D5DB; }
    .actions button:active { transform: scale(0.96); }

    .chat { padding: 24px; flex: 1; min-height: 0; overflow-y: auto; scroll-behavior: smooth; background: #ffffff; }

    .row { display: flex; gap: 12px; margin: 20px 0; }
    .row.user { justify-content: flex-end; }
    .row.bot { justify-content: flex-start; }

     /* 聊天气泡质感升级 */
    .bubble { max-width: min(780px, 90%); padding: 18px 22px; border-radius: 20px; line-height: 1.65; font-size: 14.5px; box-shadow: 0 2px 8px -2px rgba(15, 23, 42, 0.04); transition: transform 0.2s ease; letter-spacing: 0.01em; }
    /* 用户气泡：右下角直角，柔和背景 */
    .user .bubble { background: #F1F5F9; color: #0F172A; border-bottom-right-radius: 4px; border: 1px solid #E2E8F0; }
    /* Bot 气泡：左下角直角，带微阴影 */
    .bot .bubble { background: #ffffff; color: #1F2937; border-bottom-left-radius: 4px; border: 1px solid rgba(226, 232, 240, 0.6); }

    .composer-container { padding: 16px 24px 20px 24px; background: linear-gradient(180deg, rgba(255,255,255,0) 0%, #ffffff 20%); }

    /* 输入框容器变为胶囊状并增加弥散阴影 */
    .composer { position: relative; display: flex; align-items: flex-end; background: #ffffff; border: 1px solid var(--border); border-radius: 24px; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    /* 聚焦时不仅变色，还会轻微上浮 */
    .composer:focus-within { border-color: #CBD5E1; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); transform: translateY(-1px); }

    textarea { flex: 1; resize: none; height: 54px !important; min-height: 54px !important; max-height: 150px !important; padding: 16px 54px 16px 20px; background: transparent; border: none; outline: none; font-size: 15px; line-height: 1.5; font-family: var(--sans); color: #111827; }
    textarea::placeholder { color: #9CA3AF; }

    .send { position: absolute; right: 10px; bottom: 10px; background: var(--accent); color: #fff; border: none; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease; }
    .send svg { width: 16px; height: 16px; fill: currentColor; }
    .send:hover:not(:disabled) { background: var(--accent-hover); transform: scale(1.05); }
    .send:disabled { background: #D1D5DB; cursor: not-allowed; transform: none; }
    .send:active:not(:disabled) { transform: scale(0.92); }

    .statusText { font-size: 12px; color: #9CA3AF; text-align: center; margin-top: 10px; }

    .bubble p { margin: 0 0 12px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble h1, .bubble h2, .bubble h3 { color: #111827; font-weight: 600; margin-top: 24px; margin-bottom: 12px; }
    .bubble h3 { font-size: 1.1em; }
    .bubble ul, .bubble ol { margin: 12px 0; padding-left: 24px; }
    .bubble li { margin: 6px 0; }
    .bubble a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .bubble a:hover { text-decoration: underline; }
    .bubble strong { color: #111827; }

    .welcome.bubble { background: transparent; border: none; padding: 0; max-width: 100%; }
    .welcome-header { font-size: 24px; font-weight: 700; color: #111827; margin-bottom: 8px; letter-spacing: -0.02em;}
    .welcome-sub { font-size: 16px; color: #4B5563; margin-bottom: 24px; }
    .suggestion-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
    .suggestion-card { background: #ffffff; border: 1px solid var(--border); padding: 16px; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; text-decoration: none; display: block; }
    .suggestion-card:hover { border-color: var(--accent); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08); transform: translateY(-2px); }
    .suggestion-card .icon { font-size: 20px; margin-bottom: 8px; display: block;}
    .suggestion-card .text { font-size: 14px; color: #374151; font-weight: 500; line-height: 1.4; }

    .typing-indicator { display: flex; gap: 5px; padding: 8px 4px; align-items: center; }
    .typing-indicator span { width: 6px; height: 6px; background: #9CA3AF; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }

    /* Tab 导航栏样式 */
    .tabs { display: flex; gap: 8px; }
    .tab-btn { 
      background: transparent; border: none; padding: 8px 16px; font-size: 14px; 
      font-weight: 600; color: var(--muted); border-radius: 8px; cursor: pointer; 
      transition: all 0.2s ease;
    }
    .tab-btn:hover { background: var(--bg); color: #111827; }
    .tab-btn.active { background: #111827; color: #ffffff; }

    /* --- 核心容器修改 --- */
    .main { display: flex; flex-direction: column; height: 100%; box-shadow: var(--shadow-lg); border-radius: var(--radius-lg); background: #ffffff; border: 1px solid var(--border); overflow: hidden;}
    
    /* ✅ 替换后的正确代码：交给 Split.js 动态计算宽高 */
    .right-panel { display: flex; flex-direction: column; gap: 0; height: 100%; min-width: 0; }
    
    /* 地图 Block */
    .map-block { background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-md); overflow: hidden; position: relative; }
    
    /* Evidence & Reference 混合 Block */
    .er-block { display: flex; flex-direction: column; background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-md); overflow: hidden; }

    /* 混合 Block 内部的 Tab 导航 */
    .er-tabs { display: flex; border-bottom: 1px solid var(--border); background: #F8FAFC; }
    .er-tab-btn { flex: 1; padding: 12px; font-size: 13px; font-weight: 600; color: var(--muted); background: transparent; border: none; border-bottom: 2px solid transparent; cursor: pointer; transition: all 0.2s; }
    .er-tab-btn:hover { color: #111827; background: #F1F5F9; }
    .er-tab-btn.active { color: #111827; border-bottom-color: #111827; background: #ffffff; }

    /* 内部视图内容区 */
    .er-content { flex: 1; overflow-y: auto; background: #F8FAFC; position: relative; }
    .er-view { display: none; height: 100%; width: 100%; } 
    .er-view.active { display: block; }

    #reference-view { padding: 24px; } /* 只有 Reference 文字页需要内边距 */

    /* 让 Evidence 里的卡片适应右侧栏的宽度 */
    .e-node { width: 100%; max-width: 100%; }

    .jump-map-btn {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 12px;
      padding: 8px 16px; background: #E0E7FF; color: #4338CA; border: none;
      border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer;
      transition: background 0.2s;
    }
    .jump-map-btn:hover { background: #C7D2FE; }

    .full-map { width: 100%; height: 100%; }
    .back-to-chat-btn {
      position: absolute; top: 16px; left: 16px; z-index: 10;
      background: #ffffff; border: 1px solid var(--border); padding: 8px 16px;
      border-radius: 8px; cursor: pointer; box-shadow: var(--shadow-md); font-weight: 600;
    }
    .back-to-chat-btn:hover { background: #f9fafb; }

    /* =========================================
       🤖 气泡内的简易 Agent 状态样式
       ========================================= */
    .agent-steps { display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; background: #F8FAFC; border-radius: 8px; margin-bottom: 16px; border: 1px solid #E2E8F0; font-family: var(--sans); }
    .step { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #64748B; font-weight: 500; transition: all 0.3s ease; }
    .step.active { color: #0F172A; font-weight: 600; }
    .step.done { color: #10B981; }
    .step-icon { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
    .spinner-mini { width: 14px; height: 14px; border: 2px solid transparent; border-top-color: currentColor; border-left-color: currentColor; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* =========================================
       🕸️ 动态证据链 (Dynamic Evidence Tree) 样式
       ========================================= */
    #graph-view { padding: 40px; background: #F1F5F9; overflow-y: auto; display: none; }
    #graph-view.active { display: block; }
    
    .evidence-tree { display: flex; flex-direction: column; align-items: center; max-width: 1200px; margin: 0 auto; padding-bottom: 60px; }
    
    .tree-tier { width: 100%; display: flex; flex-direction: column; align-items: center; }
    .tier-title { font-size: 14px; font-weight: 700; color: #475569; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.05em; background: #E2E8F0; padding: 6px 16px; border-radius: 20px; }
    
    .node-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; width: 100%; }
    
    /* 独立碎片节点卡片 */
    .e-node {
      background: #ffffff; border: 1px solid #E2E8F0; border-radius: 12px; padding: 16px;
      width: 320px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); font-size: 13px; color: #334155;
      line-height: 1.5; transition: transform 0.2s ease; overflow: hidden;
    }
    .e-node:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    
    /* 区分不同类型的顶部高亮条 */
    .e-node.policy { border-top: 4px solid #3B82F6; }
    .e-node.case { border-top: 4px solid #10B981; }
    .e-node.building-reg { border-top: 4px solid #F59E0B; }
    .e-node.global { border-top: 4px solid #8B5CF6; } /* 💜 紫色代表宏观政策 */
    .e-node.conclusion { border-top: 4px solid #8B5CF6; width: 100%; max-width: 800px; font-size: 14.5px; }
    
    .e-node h3 { margin-top: 0; font-size: 14px; color: #0F172A; }
    .e-node h3 { margin-top: 0; font-size: 14px; color: #0F172A; }
    
    /* 💡 [新增] 专门给 Evidence 卡片标题里的超链接定制的高亮样式 */
    .e-node h3 a { 
      color: #2563EB;          /* 使用清爽的经典蓝色 */
      text-decoration: none;   /* 默认去掉下划线保持美观 */
      font-weight: 700; 
      border-bottom: 1px dashed transparent; 
      transition: all 0.2s ease;
    }
    .e-node h3 a:hover { 
      color: #1D4ED8;          /* 悬停时颜色加深 */
      border-bottom-color: #1D4ED8; /* 出现精致的虚线下划线提示可点击 */
    }
    .e-node p { margin: 8px 0; }
    .e-node ul { padding-left: 16px; margin: 8px 0; }
    
    .tree-divider { font-size: 24px; color: #CBD5E1; margin: 20px 0; font-weight: bold; }
    .empty-node { color: #9CA3AF; font-size: 13px; border: 1px dashed #CBD5E1; padding: 20px 40px; border-radius: 8px; }

    /* =========================================
       🕸️ 知识图谱 (Graph Network) 专属样式
       ========================================= */
    /* 1. 放动画布高度，让它尽可能填满右侧空间 */
    #graph-view {
      padding: 0 !important;
      position: relative; /* 确立绝对定位的参考系 */
      overflow: hidden;   /* 锁死边界，绝不允许内容撑破容器 */
    }

    #evidence-network {
      /* ✅ 核心修复 2：绝对定位大法。把它死死地钉在父容器的四个角，随外部容器自动伸缩 */
      position: absolute; 
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 100%;
      outline: none;
      background: #F8FAFC;
    }
    
    /* 覆盖 vis-network 默认的简陋 tooltip 样式 */
    div.vis-tooltip {
      position: absolute; background-color: #1E293B; color: #F8FAFC;
      border-radius: 8px; padding: 8px 12px; font-family: var(--sans);
      font-size: 12px; font-weight: 600; box-shadow: var(--shadow-md);
      pointer-events: none; white-space: nowrap;
    }

    /* 点击后弹出的详情浮动面板 (保持不变) */
    #node-detail-panel {
      position: absolute;
      bottom: 24px; right: 24px;
      width: 360px; max-height: 500px; overflow-y: auto;
      background: #ffffff; border: 1px solid #E2E8F0;
      border-radius: 12px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
      display: none; z-index: 100; transition: all 0.2s ease;
    }
    .close-detail-btn {
      position: absolute; top: 12px; right: 12px;
      background: #F1F5F9; border: none; width: 24px; height: 24px;
      border-radius: 50%; font-size: 14px; cursor: pointer;

  <script>
    // ✅ 升级 Marked 渲染器：让所有 Markdown 解析生成的超链接原生自带新窗口打开属性
    const renderer = new marked.Renderer();
    renderer.link = function(optsOrHref, title, text) {
      let href = optsOrHref;
      let t = title;
      let txt = text;
      // 兼容新版 marked.js 将参数封装为对象的行为
      if (typeof optsOrHref === 'object' && optsOrHref !== null) {
        href = optsOrHref.href;
        t = optsOrHref.title;
        txt = optsOrHref.text;
      }
      return `<a href="${href}" ${t ? `title="${t}"` : ''} target="_blank" rel="noopener noreferrer">${txt}</a>`;
    };
    // ✅ 跨版本安全初始化：防止新版 marked 抛出异常导致整个页面脚本崩溃
    try {
      marked.setOptions({ breaks: true, gfm: true });
    } catch(e) {
      if (typeof marked.use === 'function') {
        marked.use({ breaks: true, gfm: true });
      }
    }
    document.addEventListener('click', function(e) {
      const anchor = e.target.closest('a');
      if (anchor) {
        const href = anchor.getAttribute('href');
        // 排除掉功能性的死链接（比如侧边栏 Clear Dates 的 href="#"）
        if (href && !href.startsWith('#') && !href.startsWith('javascript:')) {
          anchor.setAttribute('target', '_blank');
          anchor.setAttribute('rel', 'noopener noreferrer'); // 提升安全性和性能
        }
      }
    });

    const API_BASE = "https://xchengcode--plannos-chat-pages-bot-v2-fastapi-app-dev.modal.run"; 

    const chatEl = document.getElementById("chat");
    const msgEl = document.getElementById("msg");
    const sendBtn = document.getElementById("sendBtn");
    const clearBtn = document.getElementById("clearBtn");
    const statusText = document.getElementById("statusText");

    let lastAssistantText = "";
    let isSending = false;

    // ==========================================
    // 🌍 全局地图与 Tab 切换逻辑
    // ==========================================
    let sharedMapboxMap = null;

    // ✅ 新增：监听模式切换，控制 Council 下拉框的显示/隐藏
    // ✅ 监听模式切换，控制 Council 下拉框 和 Evidence Tree 的显示/隐藏
    // ✅ 监听模式切换，控制 Council 下拉框 和 Evidence Tree 的显示/隐藏
    document.querySelectorAll('input[name="search_mode"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        const mode = e.target.value;
        const councilGroup = document.getElementById('councilGroup');
        
        // 只有 Policy 模式需要选 Council，其他模式隐藏
        if (mode === 'policy') {
          councilGroup.style.display = 'block';
        } else {
          councilGroup.style.display = 'none';
        }

        // 控制 Evidence Tree 选项卡的显示/隐藏
        const graphTabBtn = document.querySelector('.er-tab-btn[data-target="graph-view"]');
        const refTabBtn = document.querySelector('.er-tab-btn[data-target="reference-view"]');
        
        // ✅ Policy, Application 和 Building Regulation 模式下，隐藏证据树
        if (mode === 'policy' || mode === 'application' || mode === 'building_regulation') {
          graphTabBtn.style.display = 'none';
          
          if (graphTabBtn.classList.contains('active')) {
             graphTabBtn.classList.remove('active');
             refTabBtn.classList.add('active');
             document.getElementById('graph-view').classList.remove('active');
             document.getElementById('reference-view').classList.add('active');
          }
        } else {
          graphTabBtn.style.display = ''; 
        }
      });
    });

    function initOrGetMap() {
      if (!sharedMapboxMap) {
        mapboxgl.accessToken = 'pk.eyJ1IjoiYm95dWFuY2hlbmciLCJhIjoiY21wY3JtNnVoMDEyYzJxcW5yN2F4ZXJyMiJ9.w0LlgI7mvjV1iMzw37FVgQ';
        sharedMapboxMap = new mapboxgl.Map({
          container: 'global-map',
          style: 'mapbox://styles/mapbox/standard',
          center: [-0.1278, 51.5074], // 默认初始状态：俯瞰伦敦
          zoom: 10, 
          pitch: 45, 
          bearing: -10, 
          attributionControl: false
        });
        sharedMapboxMap.addControl(new mapboxgl.NavigationControl({ visualizePitch: true }), 'top-right');
      }
      return sharedMapboxMap;
    }

    let network = null;

    // ✅ 解析大模型文本并转化为 Nodes (节点) 和 Edges (连线)
    function buildGraphData(policyText, caseText, brText, globalText) {
      let nodes = [];
      let edges = [];
      let nodeId = 1;

      // 1. 创建中心节点 (Chief Analysis)
      nodes.push({ 
        id: 0, 
        label: 'Target\nAnalysis', 
        shape: 'circle', 
        color: { background: '#0F172A', border: '#0F172A' },
        font: { color: 'white', face: 'var(--sans)', multi: 'html', bold: true },
        size: 25,
        title: "Chief Consultant (Target Analysis)"
      });

      // 内部解析器
      function parseToNodes(text, groupType, colorHex) {
        if (!text || text.trim() === "") return;
        let chunks = text.split(/(?=### )/g);
        if (chunks.length <= 1) { chunks = text.split(/\n\n+/); }

        chunks.forEach(c => {
          let clean = c.trim().replace(/###\s*(?:\[\d+\])+\s*(?:Type:\s*[^|]+\|\s*Council:\s*[^|]+\|\s*(?:Source|Doc|Doc Name|App ID):\s*)?/ig, '### ');
          clean = clean.replace(/\[\d+(?:,\s*\d+)*\]/g, '').replace(/\]\s+\(/g, '](').replace(/\[\[(.*?)\]\]/g, '[$1]');
          clean = clean.replace(/(\b\d{2,4})_(\d{3,5})_([A-Z0-9]+\b)/ig, '$1/$2/$3');

          if (clean.length > 20) {
            // 提取简短的标题作为节点标签 (Label)
            let titleMatch = clean.match(/###\s*(.*)/);
            let rawTitle = titleMatch ? titleMatch[1].replace(/\[|\]|\(http.*?\)/g, '') : `${groupType} Detail`;
            let shortLabel = rawTitle.length > 15 ? rawTitle.substring(0, 15) + '...' : rawTitle;

            // 压入节点
            nodes.push({
              id: nodeId,
              label: shortLabel,
              title: shortLabel, // 鼠标悬停只显示简短名称
              shape: 'dot',
              size: 15,
              color: { background: colorHex, border: '#ffffff', hover: { background: colorHex, border: '#000000' } },
              font: { face: 'var(--sans)' },
              // ✅ 把清洗好的原始 Markdown 文本存起来，留给点击时渲染
              markdownText: clean, 
              nodeType: groupType // 记录一下是 Policy 还是 Case，方便上色
            });

            // 压入连线 (连接到中心节点)
            edges.push({ from: 0, to: nodeId, color: '#CBD5E1', width: 2, length: 150 });
            nodeId++;
          }
        });
      }

      // 2. 解析 Policy 生成蓝色节点，解析 Case 生成绿色节点
      parseToNodes(policyText, 'Local Policy', '#3B82F6');   // 💙 蓝：地方政策
      parseToNodes(globalText, 'Global Policy', '#8B5CF6');  // 💜 紫：GLA/England宏观政策
      parseToNodes(caseText, 'Case', '#10B981');             // 💚 绿：案例
      parseToNodes(brText, 'Building Reg', '#F59E0B');       // 🧡 橙：建筑规范

      return { nodes, edges };
    }

    // ✅ 渲染图谱
    function renderNetwork(data) {
      const container = document.getElementById('evidence-network');
      
      const options = {
        interaction: { hover: true, tooltipDelay: 200 },
        physics: {
          solver: 'forceAtlas2Based', // 类似引力和排斥力的经典物理引擎
          forceAtlas2Based: { gravitationalConstant: -60, centralGravity: 0.01, springLength: 150, springConstant: 0.08 }
        },
        nodes: { borderWidth: 2, shadow: true }
      };

      if (network) { network.destroy(); }
      network = new vis.Network(container, data, options);

      // ✅ 新增：监听节点的点击事件
      network.on("click", function (params) {
        const panel = document.getElementById('node-detail-panel');
        const content = document.getElementById('node-detail-content');

        if (params.nodes.length > 0) {
          const clickedNodeId = params.nodes[0];
          // 排除中心节点 (ID 为 0)
          if (clickedNodeId === 0) {
            panel.style.display = 'none';
            return;
          }

          // 找出被点击的节点数据
          // 找出被点击的节点数据
          // 找出被点击的节点数据
          const clickedNode = data.nodes.find(n => n.id === clickedNodeId);
          if (clickedNode && clickedNode.markdownText) {
            
            // ✅ 动态决定卡片顶部的颜色条：Policy 是蓝色，Case 是绿色，Building Reg 是橙色
            let typeClass = '';
            if (clickedNode.nodeType === 'Local Policy') typeClass = 'policy';
            else if (clickedNode.nodeType === 'Global Policy') typeClass = 'global'; // ✅ 加入这一行
            else if (clickedNode.nodeType === 'Case') typeClass = 'case';
            else if (clickedNode.nodeType === 'Building Reg') typeClass = 'building-reg';
            
            // 将存好的 Markdown 文本渲染为我们熟悉的 e-node 卡片
            content.innerHTML = `<div class="e-node ${typeClass}">${marked.parse(clickedNode.markdownText)}</div>`;
            
            // 显示面板
            panel.style.display = 'block';
          }
        } else {
          // 如果点击了空白处，隐藏面板
          panel.style.display = 'none';
        }
      });
    }

    function splitIntoNodes(text, type) {
      if (!text || text.trim() === "") return [];
      
      let chunks = text.split(/(?=### )/g);
      if (chunks.length <= 1) { chunks = text.split(/\n\n+/); }
      
      return chunks.map(c => c.trim()).filter(c => c.length > 20).map(c => {
        // 1. 清理可能残余的系统前缀
        let cleanText = c.replace(/###\s*(?:\[\d+\])+\s*(?:Type:\s*[^|]+\|\s*Council:\s*[^|]+\|\s*(?:Source|Doc|Doc Name|App ID):\s*)?/ig, '### ');
        
        // 2. 抹除证据面板中多余的纯数字方括号角标
        cleanText = cleanText.replace(/\[\d+(?:,\s*\d+)*\]/g, '');
        
        // 3. 终极容错：修复大模型在 Markdown 链接中产生的空格幻觉
        cleanText = cleanText.replace(/\]\s+\(/g, '](');
        
        // 4. 彻底平铺可能残留的双中括号
        cleanText = cleanText.replace(/\[\[(.*?)\]\]/g, '[$1]');

        // ✅【核心修改 3】：如果卡片文本（包括标题、链接）里包含形如 2024_1234_FULL 这样的下划线案例号，强制全量置换为斜杠
        // 该正则能精准匹配出带有下划线的 UK 规划申请号特征并进行替换
        cleanText = cleanText.replace(/(\b\d{2,4})_(\d{3,5})_([A-Z0-9]+\b)/ig, '$1/$2/$3');
        
        return `<div class="e-node ${type}">${marked.parse(cleanText)}</div>`;
      });
    }

    function switchTab(targetId) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        if (btn.dataset.target === targetId) btn.classList.add('active');
        else btn.classList.remove('active');
      });
      
      document.querySelectorAll('.view').forEach(view => {
        if (view.id === targetId) view.classList.add('active');
        else view.classList.remove('active');
      });

      if (targetId === 'map-view') {
        initOrGetMap(); // 点击地图标签时，如果没有初始化则立即初始化初始状态
        setTimeout(() => { sharedMapboxMap.resize(); }, 50);
      }
    }

    // ✅ 局部 Evidence / Reference 切换逻辑
    // ✅ 局部 Evidence / Reference 切换逻辑
    document.querySelectorAll('.er-tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const targetId = e.target.dataset.target;
        
        // 按钮高亮切换
        document.querySelectorAll('.er-tab-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        
        // 面板显示切换
        document.querySelectorAll('.er-view').forEach(view => {
          if (view.id === targetId) view.classList.add('active');
          else view.classList.remove('active');
        });

        // ✅ 新增：如果切回到图谱页面，强制刷新画布居中，防止因为隐藏状态下错位
        if (targetId === 'graph-view' && network) {
          setTimeout(() => { 
            network.fit(); 
          }, 50); 
        }
      });
    });

    // ==========================================
    // 🕸️ 推理过程大图 (Reasoning Graph) 控制逻辑
    // ==========================================
    function resetGraph() {
      if (network) { network.destroy(); network = null; }
      // ✅ 替换为带有 loading 动画的空状态
      document.getElementById('evidence-network').innerHTML = '<div class="empty-state loading">Reasoning and building graph...</div>';
      
      const panel = document.getElementById('node-detail-panel');
      if (panel) panel.style.display = 'none';

      // ✅ 替换为带有 loading 动画的空状态
      document.getElementById('reference-content').innerHTML = '<div class="empty-state loading">Verifying document references...</div>';
    }

    function setGraphState(stage) {
      
    }


    // ==========================================
    // 🚀 云端邮编联想
    // ==========================================
    const globalPostcodeEl = document.getElementById("globalPostcode");
    const postcodeOptionsEl = document.getElementById("postcode-options");
    let postcodeTimeout = null;

    globalPostcodeEl.addEventListener("input", (e) => {
      const val = e.target.value.trim();
      if (val.length < 2) return; 

      clearTimeout(postcodeTimeout);
      postcodeTimeout = setTimeout(async () => {
        try {
          // 1. 先尝试直接查询确切的邮编。
          // 如果用户刚好打完了完整的邮编，或者从下拉列表里点击选中了，这里就会成功。
          const exactRes = await fetch(`https://api.postcodes.io/postcodes/${encodeURIComponent(val)}`);
          if (exactRes.ok) {
            const exactData = await exactRes.json();
            if (exactData.result) {
              const { latitude, longitude } = exactData.result;
              const map = initOrGetMap();
              
              // 清除旧红点
              document.querySelectorAll('.mapboxgl-marker').forEach(el => el.remove());
              
              // 飞向目标并扎上红点
              map.flyTo({ center: [longitude, latitude], zoom: 16.5 });
              const targetPopup = new mapboxgl.Popup({ offset: 25, closeButton: false })
                .setHTML(`<b style="font-family: var(--sans);">Target Location:</b><br><span style="font-family: var(--sans);">${val}</span>`);
              new mapboxgl.Marker({ color: "#EF4444" })
                .setLngLat([longitude, latitude])
                .setPopup(targetPopup)
                .addTo(map);
                
              return; // 🎯 既然已经精准定位了，就不需要再去查联想词了，直接结束。
            }
          }

          // 2. 如果不是完整邮编（比如刚输入了 "EC2"），API 报错 404，就会走到这里继续查联想词。
          const res = await fetch(`https://api.postcodes.io/postcodes/${encodeURIComponent(val)}/autocomplete`);
          if (res.ok) {
            const data = await res.json();
            if (data.result && data.result.length > 0) {
              postcodeOptionsEl.innerHTML = ""; 
              data.result.forEach(pc => {
                const opt = document.createElement("option");
                opt.value = pc;
                postcodeOptionsEl.appendChild(opt);
              });
            }
          }
        } catch (err) {
          // 忽略网络报错，不打断用户输入
        }
      }, 300); 
    });

    // ==========================================
    // 💬 聊天室渲染 & 🤖 气泡内小状态机
    // ==========================================
    function addMessage(role, text, { html = false, markdown = false } = {}) {
      const row = document.createElement("div");
      row.className = "row " + role;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      const raw = (text || "").trim();

      if (html) bubble.innerHTML = raw;
      else if (markdown) bubble.innerHTML = marked.parse(raw);
      else bubble.textContent = raw;

      row.appendChild(bubble);
      chatEl.appendChild(row);
      chatEl.scrollTop = chatEl.scrollHeight;
      return bubble;
    }

    function setSending(on){
      isSending = on;
      sendBtn.disabled = on;
      msgEl.disabled = on;
      statusText.textContent = on ? "Plannos Agents are analyzing data..." : "AI can make mistakes. Verify important planning information.";
      
      document.querySelectorAll('input[name="search_mode"]').forEach(radio => radio.disabled = on);
      document.getElementById("nearbyCount").disabled = on;
      document.getElementById("globalPostcode").disabled = on;
      document.getElementById("dateFrom").disabled = on;
      document.getElementById("dateTo").disabled = on;
      document.getElementById("distanceFilter").disabled = on;
    }

    function updateAgentStatus(bubble, message, isFinal = false) {
      let stepsBox = bubble.querySelector('.agent-steps');
      
      if (!stepsBox) {
        bubble.insertAdjacentHTML('afterbegin', `<div class="agent-steps"></div>`);
        stepsBox = bubble.querySelector('.agent-steps');
        const typingInd = bubble.querySelector('.typing-indicator');
        if (typingInd) typingInd.style.display = 'none';
      }

      const prevActive = stepsBox.querySelector('.step.active');
      if (prevActive) {
        prevActive.classList.remove('active');
        prevActive.classList.add('done');
        prevActive.querySelector('.step-icon').innerHTML = '✓';
      }

      if (!isFinal && message) {
        stepsBox.insertAdjacentHTML('beforeend', `
          <div class="step active">
            <span class="step-icon"><div class="spinner-mini"></div></span>
            <span class="step-text">${message}</span>
          </div>
        `);
      }
    }

    // ==========================================
    // 📡 核心通信逻辑 (处理 SSE 流)
    // ==========================================
    async function send(){
      const msg = msgEl.value.trim();
      if (!msg || isSending) return;

      msgEl.value = "";
      msgEl.style.height = '54px';

      const selectedMode = document.querySelector('input[name="search_mode"]:checked').value;
      const selectedNearbyCount = parseInt(document.getElementById("nearbyCount").value, 10);
      const globalPostcode = document.getElementById("globalPostcode").value.trim();
      const dateFrom = document.getElementById("dateFrom").value;
      const dateTo = document.getElementById("dateTo").value;
      const distanceFilter = document.getElementById("distanceFilter").value;
      const selectedCouncil = document.getElementById("councilSelect").value;

      // 把用户发的消息渲染上屏
      addMessage("user", msg);

      // ✅ 【核心拦截】：如果左侧没填邮编，不管问什么都直接弹提示并阻断！
      // ✅ 【核心拦截】：如果是 Building Regulation，直接放行
      if (selectedMode !== "policy" && selectedMode !== "building_regulation" && !globalPostcode) {
        addMessage("bot", "> ⚠️ **Missing Information:** Please enter a **Target Postcode** in the left sidebar to continue.", { markdown: true });
        return; 
      } else if (selectedMode === "policy" && !globalPostcode && !selectedCouncil) {
        addMessage("bot", "> ⚠️ **Missing Information:** Please select a **Target Council** or enter a Postcode to continue.", { markdown: true });
        return;
      }

      const bubble = addMessage("bot", "");
      bubble.innerHTML = `<div class='text-content'><div class="typing-indicator"><span></span><span></span><span></span></div></div>`;
      const textContainer = bubble.querySelector('.text-content');

      lastAssistantText = "";
      setSending(true);
      
      // 发送请求前，重置推理图，并进入第一阶段
      resetGraph();
      setGraphState('init');

      try{
        const res = await fetch(`${API_BASE}/chat`, {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({
            message: msg, 
            mode: selectedMode,
            nearby_count: selectedNearbyCount,
            postcode: globalPostcode,
            council: selectedCouncil, // <--- 新增这行
            date_from: dateFrom,
            date_to: dateTo,
            distance_filter: distanceFilter 
          })
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        
        let deltaStarted = false;

        while(true){
          const {value, done} = await reader.read();
          if(done) break;
          buffer += decoder.decode(value, {stream:true});

          const parts = buffer.split("\n\n");
          buffer = parts.pop();

          for(const p of parts){
            if(!p.startsWith("data: ")) continue;
            const evt = JSON.parse(p.slice(6));
            
            // ✅ 新增：捕捉后端的细颗粒度状态，并展示在气泡的步骤栏里
            if (evt.type === "status") {
              updateAgentStatus(bubble, evt.message);
              chatEl.scrollTop = chatEl.scrollHeight;
            }
            // 1. 接收到主模型打字
            // 1. 接收到主模型打字
            else if(evt.type === "delta"){
              // ✅ 核心修复：不用管是否是第一次打字，只要有文字进来，就把还在转圈的步骤打上绿勾
              const activeStep = bubble.querySelector('.agent-steps .step.active');
              if (activeStep) { 
                 updateAgentStatus(bubble, "", true); 
              }
              
              lastAssistantText += evt.text;

              let processedChatText = lastAssistantText.replace(/(\b\d{2,4})_(\d{3,5})_([A-Z0-9]+\b)/ig, '$1/$2/$3');
              textContainer.innerHTML = marked.parse(processedChatText);
              chatEl.scrollTop = chatEl.scrollHeight;

              // ❌ 删掉这行：document.getElementById('conclusion-node').innerHTML = marked.parse(processedChatText);
            }
            
            // 2. 接收到底层 Agent 的原始数据 (在这里进行文本切割，生成碎片节点)
            // 2. 接收到底层 Agent 的原始数据 (转化为关联节点图)
            else if (evt.type === "evidence") {
              // ✅ 传入第四个参数：evt.data.global_policy
              const graphData = buildGraphData(evt.data.policy, evt.data.cases, evt.data.building_regs, evt.data.global_policy);
              
              if (graphData.nodes.length > 1) {
                renderNetwork(graphData);
              } else {
                document.getElementById('evidence-network').innerHTML = '<div class="empty-node" style="text-align: center; margin-top: 40px;">No evidence extracted.</div>';
              }
            }
            // 3. 接收到地图数据
            else if (evt.type === "map") {
              const mapData = evt.data;

              const linkContainer = document.createElement('div');
              linkContainer.innerHTML = `<button class="jump-map-btn">📍 View on Map (${mapData.markers.length} cases nearby)</button>`;
              bubble.appendChild(linkContainer);

              linkContainer.querySelector('.jump-map-btn').addEventListener('click', () => { switchTab('map-view'); });
              chatEl.scrollTop = chatEl.scrollHeight;

              setTimeout(() => {
                const map = initOrGetMap();
                map.flyTo({ center: [mapData.target.lon, mapData.target.lat], zoom: 16.5 });

                document.querySelectorAll('.mapboxgl-marker').forEach(el => el.remove());

                // 重新扎上红色的 Target 中心点
                const targetPopup = new mapboxgl.Popup({ offset: 25, closeButton: false }).setHTML(`<b style="font-family: var(--sans);">Target Location:</b><br><span style="font-family: var(--sans);">${mapData.target.label}</span>`);
                new mapboxgl.Marker({ color: "#EF4444" }).setLngLat([mapData.target.lon, mapData.target.lat]).setPopup(targetPopup).addTo(map);

                // 扎上蓝色的历史案例点
                mapData.markers.forEach(m => {
                    let searchUrl = m.url || `https://www.google.com/search?q=${encodeURIComponent(m.council + ' planning application ' + m.app_id)}`;
                    const popupHtml = `<div style="font-family: var(--sans);"><b style="color: #111827; font-size: 13px;">Historical Case</b><br><span style="color: #4B5563; font-size: 12px;">${m.label}</span><br><a href="${searchUrl}" target="_blank" style="display: inline-block; margin-top: 8px; color: var(--accent); font-size: 12px; font-weight: 600; text-decoration: none;">View Official Record ↗</a></div>`;
                    new mapboxgl.Marker({ color: "#3B82F6" }).setLngLat([m.lon, m.lat]).setPopup(new mapboxgl.Popup({ offset: 25 }).setHTML(popupHtml)).addTo(map);
                });
              }, 150);
            }
            
            else if (evt.type === "references") {
              let cleanRef = evt.text.replace(/\]\s+\(/g, ']('); // 物理清洗可能残留的链接空格幻觉
              cleanRef = cleanRef.replace(/\[\[(.*?)\]\]/g, '[$1]'); // 降维可能残存的双括号
              
              // 渲染进专门的 References 面板中，并由我们之前写好的全局事件实现 target="_blank" 新标签页外跳
              document.getElementById('reference-content').innerHTML = marked.parse(cleanRef);
            }
            // 4. 流程结束
            // 4. 流程结束
            else if (evt.type === "done") {
              setGraphState('complete');
              
              // ✅ 终极兜底：如果整个流都结束了，发现还有没关掉的转圈状态，强行绿勾
              const activeStep = bubble.querySelector('.agent-steps .step.active');
              if (activeStep) { 
                 updateAgentStatus(bubble, "", true); 
              }
            }
          }
        }
      } catch(err){
        textContainer.innerHTML = "Error connecting to Plannos AI. Please try again.";
      } finally{
        setSending(false);
      }
    }

    // ==========================================
    // 🗺️ 直接看全量地图逻辑 (不经过 AI 聊天)
    // ==========================================
    document.getElementById("directMapBtn").addEventListener("click", async () => {
      const pc = document.getElementById("globalPostcode").value.trim();
      if (!pc) {
        alert("Please enter a Target Postcode first.");
        return;
      }
      
      // 读取筛选条件（跳过 Fetch Count 滑动条，因为地图模式默认抓取 100 个）
      const dateFrom = document.getElementById("dateFrom").value;
      const dateTo = document.getElementById("dateTo").value;
      const distanceFilter = document.getElementById("distanceFilter").value;
      
      // 1. 自动帮用户切换到地图 Tab 面板s
      //switchTab('map-view');
      
      // 2. 按钮加载动画
      const btn = document.getElementById("directMapBtn");
      const originalText = btn.innerHTML;
      btn.innerHTML = "⏳ Loading map data...";
      btn.disabled = true;
      
      try {
        // 请求我们刚才在后端新建的轻量级 API
        const res = await fetch(`${API_BASE}/api/map-only`, {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({
            postcode: pc,
            date_from: dateFrom,
            date_to: dateTo,
            distance_filter: distanceFilter
          })
        });
        
        const data = await res.json();
        if (data.error) {
          alert(data.error);
          return;
        }
        
        // 3. 开始渲染地图
        const map = initOrGetMap();
        map.flyTo({ center: [data.target.lon, data.target.lat], zoom: 15.5 });
        
        // 清理旧点
        document.querySelectorAll('.mapboxgl-marker').forEach(el => el.remove());
        
        // 扎上红点 (目标中心)
        const targetPopup = new mapboxgl.Popup({ offset: 25, closeButton: false }).setHTML(`<b style="font-family: var(--sans);">Target Location:</b><br><span style="font-family: var(--sans);">${data.target.label}</span>`);
        new mapboxgl.Marker({ color: "#EF4444" }).setLngLat([data.target.lon, data.target.lat]).setPopup(targetPopup).addTo(map);
        
        // 批量扎上蓝点 (周围历史案例)
        data.markers.forEach(m => {
            let searchUrl = m.url || `https://www.google.com/search?q=${encodeURIComponent(m.council + ' planning application ' + m.app_id)}`;
            const popupHtml = `<div style="font-family: var(--sans);"><b style="color: #111827; font-size: 13px;">Historical Case</b><br><span style="color: #4B5563; font-size: 12px;">${m.label}</span><br><a href="${searchUrl}" target="_blank" style="display: inline-block; margin-top: 8px; color: var(--accent); font-size: 12px; font-weight: 600; text-decoration: none;">View Official Record ↗</a></div>`;
            new mapboxgl.Marker({ color: "#3B82F6" }).setLngLat([m.lon, m.lat]).setPopup(new mapboxgl.Popup({ offset: 25 }).setHTML(popupHtml)).addTo(map);
        });
        
      } catch(e) {
        console.error(e);
        alert("Failed to load map data from server.");
      } finally {
        // 恢复按钮状态
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    });

    sendBtn.addEventListener("click", send);
    msgEl.addEventListener('input', function() { this.style.height = '54px'; this.style.height = (this.scrollHeight) + 'px'; });
    msgEl.addEventListener("keydown", (e)=>{ if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); } });

    // ==========================================
    // 🎨 初始化界面与交互
    // ==========================================
    function showWelcome() {
      chatEl.innerHTML = "";
      const welcomeBubble = addMessage("bot", `
      <div class="welcome-header">Hello! How can I help with your property?</div>
      <div class="welcome-sub">I'm your AI planning assistant. I can navigate local policies and find nearby approved projects.</div>
      <div class="suggestion-grid">
        <a href="#" class="suggestion-card" data-example="Are there any nearby applications for roof extensions? What does the local policy say about it?">
          </span><span class="text">Find roof extension precedents</span>
        </a>
        <a href="#" class="suggestion-card" data-example="What is the local policy on carbon reduction targets, and are there recent approved examples?">
          </span><span class="text">Explain carbon reduction policy</span>
        </a>
        <a href="#" class="suggestion-card" data-example="Show me all applications related to basement excavations within a 0.5-mile radius.">
          </span><span class="text">Find nearby basement cases</span>
        </a>
      </div>
      `, { html: true });
      welcomeBubble.classList.add("welcome");

    clearBtn.addEventListener("click", () => {

    };

    // ✅ 页面一加载就初始化常驻地图
    setTimeout(() => { initOrGetMap(); }, 200);

    // 1️⃣ 激活三栏自由拖拽功能 (左右分栏)
    Split(['#panel-1', '#panel-2', '#panel-3'], {
      sizes: [18, 40, 42],        // 默认宽度比例
      minSize: [220, 350, 400],   // 限制极小值，防止拉没了
      gutterSize: 8,              // 拖拽条宽度
      onDragEnd: function() {
        if (sharedMapboxMap) { sharedMapboxMap.resize(); }
        if (network) { setTimeout(() => { network.fit(); }, 50); }

    // 2️⃣ 激活右侧地图与下方证据面板的自由拖拽功能 (上下分栏)
    Split(['#map-block', '#er-block'], {
      direction: 'vertical',      // 关键：设置为垂直拉伸
      sizes: [40, 60],            // 默认地图占 40%，下方占 60%
      minSize: [150, 200],        // 限制上下缩小的极限值
      gutterSize: 8,              // 拖拽条高度
      onDragEnd: function() {
        // 拉动结束后，让地图和关系图谱自动重绘填满新空间
        if (sharedMapboxMap) { sharedMapboxMap.resize(); }

    });

  </script>
